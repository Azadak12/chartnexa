name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Throwaway CI database with trust auth; no credentials involved.
  TEST_DATABASE_ADMIN_URL: postgresql://postgres@localhost:5432/postgres

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm secrets

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migration round trip (up, no-op, down, up)
        run: pnpm --filter @chartnexa/api migrate:roundtrip
      - run: pnpm build
      - name: Export and check OpenAPI document
        run: |
          pnpm --filter @chartnexa/api openapi:export "$RUNNER_TEMP/openapi.json"
          node -e 'const d=JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/openapi.json","utf8"));for(const p of ["/health/live","/health/ready","/auth/register","/auth/login","/auth/refresh","/auth/logout","/auth/password/forgot","/auth/password/reset","/me","/me/sessions","/me/access","/staff/users/lookup","/staff/users/{id}/role","/staff/audit-events","/courses","/courses/{id}","/staff/courses","/staff/courses/{id}/publish","/staff/instructors/{id}/permissions","/staff/instructors/{id}/grants","/staff/instructors/{id}/grants/{grantId}/revoke","/courses/{courseId}/lessons","/courses/{courseId}/lessons/{lessonId}","/staff/courses/{courseId}/lessons","/staff/courses/{courseId}/lessons/order","/staff/courses/{courseId}/lessons/{lessonId}","/staff/courses/{courseId}/entitlements","/staff/courses/{courseId}/entitlements/{entitlementId}/revoke","/me/courses","/me/courses/{courseId}/progress","/me/courses/{courseId}/lessons/{lessonId}/completion","/auth/mfa/verify","/auth/mfa/setup/start","/auth/mfa/setup/complete","/me/mfa","/me/mfa/recovery-codes","/staff/users/{id}/mfa/reset","/courses/{courseId}/reviews","/me/courses/{courseId}/review","/me/courses/{courseId}/review/appeal","/courses/{courseId}/reviews/{reviewId}/report","/staff/reviews","/staff/reviews/{reviewId}","/staff/reviews/{reviewId}/hide","/staff/reviews/{reviewId}/restore","/staff/review-appeals/{appealId}/decide","/categories","/staff/categories","/staff/categories/{id}","/staff/courses/{courseId}/modules","/staff/courses/{courseId}/modules/order","/staff/courses/{courseId}/modules/{moduleId}","/staff/courses/{courseId}/lessons/{lessonId}/module","/staff/courses/{courseId}/lessons/{lessonId}/uploads","/staff/courses/{courseId}/uploads/{uploadId}/parts/{part}","/staff/courses/{courseId}/uploads/{uploadId}/complete","/staff/courses/{courseId}/lessons/{lessonId}/resources","/courses/{courseId}/lessons/{lessonId}/resources","/courses/{courseId}/lessons/{lessonId}/resources/{resourceId}/link","/files/{resourceId}","/staff/courses/{courseId}/lessons/{lessonId}/video/uploads","/staff/courses/{courseId}/uploads/{uploadId}/complete-video","/staff/courses/{courseId}/lessons/{lessonId}/video","/courses/{courseId}/lessons/{lessonId}/video","/me/courses/{courseId}/lessons/{lessonId}/video-progress","/videos/{videoId}/stream","/me/orders","/me/orders/{orderId}","/payments/test/checkouts/{ref}/complete","/payments/webhooks/{provider}","/staff/orders","/staff/courses/{courseId}/live-sessions","/staff/courses/{courseId}/live-sessions/{sessionId}","/staff/courses/{courseId}/live-sessions/{sessionId}/cancel","/courses/{courseId}/live-sessions","/me/live-sessions","/me/courses/{courseId}/live-sessions/{sessionId}/join","/me/continue-learning","/staff/courses/{courseId}/thumbnail","/courses/thumbnails/{id}","/staff/instructor-invitations","/staff/instructor-invitations/{id}","/staff/instructor-invitations/{id}/resend","/staff/instructors","/staff/instructors/{userId}/deactivate","/auth/instructor-invitations/accept","/staff/announcements","/staff/announcements/{id}/withdraw","/me/announcements","/me/announcements/unread-count","/me/announcements/{id}/read"]){if(!d.paths[p])throw new Error("missing "+p)}if(!d.components.schemas.ErrorEnvelope)throw new Error("missing ErrorEnvelope")'
      - uses: actions/upload-artifact@v7
        with:
          name: openapi
          path: ${{ runner.temp }}/openapi.json

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_NO_TELEMETRY: "1"
    # The contract tests run the app's auth code against the real API and a real database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, test and export production bundles (iOS and Android)
        run: pnpm turbo run typecheck test build --filter=@chartnexa/mobile...

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:deps
